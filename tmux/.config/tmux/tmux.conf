# ~/.config/tmux/tmux.conf

# Prefix stays the default C-b (no remap).

set -g mouse on

# Colors: advertise a 256-color terminal and enable true-color (RGB) passthrough.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ",*256col*:RGB"

set -g history-limit 100000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Faster key response (no escape-time lag for vi-mode / nvim).
set -sg escape-time 10
set -g focus-events on

# vi-style copy mode.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Sensible pane splits that keep the current path, plus intuitive keys.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Minimal status bar.
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=default"
set -g status-left "#[bold]#S "
set -g status-left-length 40
set -g status-right "%Y-%m-%d %H:%M"
set -g status-right-length 40
