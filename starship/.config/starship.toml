# Starship prompt. https://starship.rs/config/
# Approximates the oh-my-zsh "muse" theme this machine used before.

"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$python\
$character"""

add_newline = false

[character]
success_symbol = "[ ᐅ](fg:77)"
error_symbol = "[ ᐅ](fg:160)"

[directory]
truncation_length = 0
truncate_to_repo = false
style = "fg:117"
format = "[$path]($style)"

[git_branch]
format = " [(${branch})](fg:12)"

[git_status]
format = "[$all_status$ahead_behind](fg:133)"
style = "fg:133"
conflicted = "═"
untracked = "✭"
modified = "✹"
staged = "✚"
renamed = "➜"
deleted = "✖"
stashed = ""
ahead = ""
behind = ""
diverged = ""

# Muse showed `[venv]`; only render when a venv is active (no version noise).
[python]
format = ' [[$virtualenv]](fg:133)'
detect_extensions = []
detect_files = []
detect_folders = []
detect_env_vars = ["VIRTUAL_ENV", "CONDA_DEFAULT_ENV"]
