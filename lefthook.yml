# lefthook — git hooks. Runs the same pinned tools as `mise run lint` / CI, but
# scoped to STAGED files for speed and with auto-fix + re-stage on formatters.
# Install once:  mise run setup   (or: lefthook install)
#
# Pinned tools are invoked via `mise exec --` so they resolve to the versions in
# mise.toml even in git's non-interactive hook shell (which lacks the activated
# mise PATH). zsh + the vendored bats runner are system/repo deps on the default
# PATH, so they're called directly. Submodule internals never appear as staged
# files, so no per-job excludes are needed.

pre-commit:
  parallel: true
  jobs:
    - name: shfmt
      glob: "*.sh"
      run: mise exec -- shfmt -w {staged_files}
      stage_fixed: true

    - name: shellcheck
      glob: "*.sh"
      run: mise exec -- shellcheck {staged_files}

    - name: zsh-parse
      glob:
        - "*.zsh"
        - "*.zshrc"
        - "*.zshenv"
        - "*.zprofile"
      run: zsh -n {staged_files}

    - name: taplo
      glob: "*.toml"
      run: mise exec -- taplo fmt {staged_files}
      stage_fixed: true

    - name: dprint
      glob: "*.md"
      run: mise exec -- dprint fmt {staged_files}
      stage_fixed: true

    - name: markdownlint
      glob: "*.md"
      run: mise exec -- markdownlint-cli2 {staged_files}

    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: mise exec -- actionlint

    - name: editorconfig
      run: mise exec -- ec -config .config/editorconfig-checker.json {staged_files}

pre-push:
  jobs:
    - name: bats
      run: ./test/bats/bin/bats test/
